# Le bot sur le VPS OVH : ~/apps/taibai-jinxing (voir deployer.sh et README.md).
name: taibai-jinxing

services:
  bot:
    build: .
    container_name: taibai-jinxing
    env_file: .env
    restart: unless-stopped
    volumes:
      # Les musiques restent sur le serveur, hors de l image : une piste ajoutee
      # apparait dans le panneau en moins de 30 s, sans reconstruire.
      - ./assets/musique:/app/assets/musique:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
